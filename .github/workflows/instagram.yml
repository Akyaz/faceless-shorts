name: Instagram'a yükle

# Daha önce üretilmiş bir çalışmanın dikey videolarını Instagram'a Reels olarak yükler.
# Paylaşılan videonun bağlantısı panel kaydına yazılır; tekrar çalıştırılırsa o video atlanır.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Videoları üreten çalışmanın numarası (Actions linkindeki sayı)"
        required: true

concurrency:
  group: instagram-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write  # Instagram bağlantısı panel-data kaydına yazılır
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Instagram kopyasına kanal adresi yazılır: ffmpeg ve Pillow gerekli
      - name: Sistem paketleri
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Python paketleri
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: short
          path: out
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Instagram'a yükle
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: |
          [ -n "$IG_ACCESS_TOKEN" ] || { echo "IG_ACCESS_TOKEN secret'ı yok"; exit 1; }
          failed=0
          for meta in out/metadata.json out/*/metadata.json; do
            [ -f "$meta" ] || continue
            python -m pipeline.instagram "$(dirname "$meta")/short.mp4" "$meta" || failed=1
          done
          exit $failed
