name: Instagram kopyası denemesi (geçici)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core && pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: short
          path: out
          run-id: 39058328139
          github-token: ${{ github.token }}
      - run: python -c "from pipeline import render; render.add_link('out/short.mp4', 'out/short.instagram.mp4')" && ffprobe -v error -show_entries format=duration -of csv=p=0 out/short.instagram.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: instagram-copy
          path: out/short.instagram.mp4
          retention-days: 1
