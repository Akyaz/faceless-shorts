name: Short üret

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Üretilen videoyu kanala da yükle"
        type: boolean
        default: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sistem paketleri
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Python paketleri
        run: pip install -r requirements.txt
      - name: Videoyu üret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pipeline.main --out out
      - uses: actions/upload-artifact@v4
        with:
          name: short
          path: |
            out/short.mp4
            out/metadata.json
      - name: YouTube'a yükle
        if: ${{ inputs.upload }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m pipeline.upload out/short.mp4 out/metadata.json
