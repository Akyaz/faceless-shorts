name: Short üret

on:
  # Saatler Türkiye saatiyle (UTC+3). GitHub zamanlamayı geciktirebildiği için 10 dakika erken başlar.
  schedule:
    # Günde 6 Shorts (maç günü 7): az ama güçlü video; çok sayıda zayıf video kanalın bütün videolarının gösterimini düşürüyor.
    # GitHub zamanlanmış çalışmaları bazen hiç başlatmıyor: her saatin 25 dakika sonrasında bir yedek var.
    # Yedek, o saatin videosu kayda geçtiyse hiçbir şey üretmeden kapanır (pipeline/slots.py; saat-tür eşleşmesi orada).
    # 10: gündem haberi; 12: eskimeyen "Biliyor muydun?"; 19: spor haberi (tek konu)
    # (her saat ayrı satırda: GitHub hangi satırın tetiklendiğini bildiriyor, birleşik satırda saat ayırt edilemez)
    - cron: "50 6 * * *"
    - cron: "15 7 * * *"
    - cron: "50 8 * * *"
    - cron: "15 9 * * *"
    - cron: "50 15 * * *"
    - cron: "15 16 * * *"
    # 15:00: eskimeyen "Biliyor muydun?" (önceden trend; tür eşleşmesi pipeline/slots.py'de)
    - cron: "50 11 * * *"
    - cron: "15 12 * * *"
    # 17:00: magazin ve kültür-sanat haberi
    - cron: "50 13 * * *"
    - cron: "15 14 * * *"
    # 13:30: maç programı (Süper Lig, yoksa Türk takımlarının Avrupa maçları); maç olmayan gün video yok
    - cron: "20 10 * * *"
    - cron: "45 10 * * *"
    # 13:00: yalnızca scripts/scheduled/ altında o güne video varsa (bayram tebriği gibi)
    - cron: "0 10 * * *"
    - cron: "25 10 * * *"
    - cron: "55 10 * * *"
    # 20:30: "Sen ne dersin?" tartışma videosu (günün özeti yorum getirmiyordu)
    - cron: "20 17 * * *"
    - cron: "45 17 * * *"
  workflow_dispatch:
    inputs:
      upload:
        description: "Üretilen videoyu kanala da yükle"
        type: boolean
        default: false
      count:
        description: "Kaç video üretilsin"
        type: number
        default: 1
      script:
        description: "Elle yazılmış metin dosyası (örnek: scripts/custom/2026-10-13.json); doluysa içindeki bütün videolar üretilir"
        type: string
        default: ""
      script_json:
        description: "Elle yazılmış metin, doğrudan JSON olarak (yönetim panelinin Metin ekranı bunu doldurur)"
        type: string
        default: ""
      results:
        description: "Maç programı (ucl): önce dünün sonuçlarını göster"
        type: boolean
        default: false
      emphasize:
        description: "Maç programı (ucl): kırmızı çerçeveye alınacak takımlar, virgülle (örnek: Bayern Münih)"
        type: string
        default: ""
      publish_at:
        description: "YouTube'da yayın zamanı (UTC, örnek 2026-10-29T07:00:00Z = 10:00 TSİ); doluysa video özel yüklenir, o anda açılır, Instagram'a yüklenmez"
        type: string
        default: ""
      mode:
        description: "Video türü: story (gündem haberi), world (İngilizce dünya haberi), trend (bilim ve teknoloji özeti), digest (günün özeti), morning (sabah özeti), sports (spor gündemi), debate (Sen ne dersin? tartışma), onthisday (İngilizce tarihte bugün), fact (eskimeyen Biliyor muydun?), sportstory (tek spor haberi), culture (magazin ve kültür-sanat), matchday (günün maç programı: Süper Lig ya da Avrupa'da Türk takımları), ucl (Şampiyonlar Ligi maç programı)"
        type: choice
        options: [story, world, trend, digest, morning, sports, debate, onthisday, fact, sportstory, culture, matchday, ucl]
        default: story

jobs:
  # Hangi saatin videosu, bugün zaten üretildi mi? Paket kurmadan birkaç saniyede karar verir.
  slot:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # asıl çalışma sürüyorsa bitmesi beklenir
    permissions:
      actions: write  # zamanlanmış Instagram paylaşımını başlatır
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      mode: ${{ steps.decide.outputs.mode }}
      slot: ${{ steps.decide.outputs.slot }}
      script: ${{ steps.decide.outputs.script }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          CUSTOM: ${{ (inputs.script || inputs.script_json) && '1' || '' }}
          WORKFLOW_FILE: make-short.yml
        run: python3 -m pipeline.slots
      # YouTube'a önceden zamanlı yüklenen videonun Instagram paylaşımı (Instagram API zamanlamayı desteklemiyor):
      # scripts/scheduled/TARİH-SAAT.instagram dosyasında videoyu üreten çalışmanın numarası durur
      - name: Zamanlanmış Instagram paylaşımı
        if: ${{ github.event_name == 'schedule' && steps.decide.outputs.slot != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SLOT: ${{ steps.decide.outputs.slot }}
        run: |
          file="scripts/scheduled/$(TZ=Europe/Istanbul date +%Y-%m-%d)-${SLOT/:/}.instagram"
          [ -f "$file" ] || exit 0
          gh workflow run instagram.yml -R "$GITHUB_REPOSITORY" -f run_id="$(tr -d '[:space:]' < "$file")"
          echo "Instagram paylaşımı başlatıldı: $(cat "$file")"

  make:
    needs: slot
    if: ${{ needs.slot.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write  # sonuç kaydı panel-data dalına yazılır
    env:
      COUNT: ${{ inputs.count || 1 }}
      MODE: ${{ needs.slot.outputs.mode }}
      SLOT: ${{ needs.slot.outputs.slot }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sistem paketleri
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Python paketleri
        run: pip install -r requirements.txt
      # Aynı haber ikinci kez videoya dönmesin diye işlenenler çalışmalar arasında taşınır
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: history-${{ github.run_id }}
          restore-keys: history-
      # İlk video out/, sonrakiler out/2, out/3... altına yazılır; işlenen haber kaydı sayesinde konular farklı olur
      - name: Videoları üret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCRIPT: ${{ inputs.script || needs.slot.outputs.script }}
          SCRIPT_JSON: ${{ inputs.script_json }}
          UCL_RESULTS: ${{ inputs.results }}
          UCL_EMPHASIZE: ${{ inputs.emphasize }}
        run: |
          failed=0
          if [ -n "$SCRIPT_JSON" ]; then  # panelden gelen metin depoya yazılmadan kullanılır
            printf '%s' "$SCRIPT_JSON" > "$RUNNER_TEMP/custom.json"
            SCRIPT="$RUNNER_TEMP/custom.json"
          fi
          if [ -n "$SCRIPT" ]; then
            COUNT=$(python -c "import json, sys; print(len(json.load(open(sys.argv[1], encoding='utf-8'))))" "$SCRIPT")
          fi
          for i in $(seq 1 "$COUNT"); do
            dir=out; [ "$i" -gt 1 ] && dir="out/$i"
            if [ -n "$SCRIPT" ]; then
              python -m pipeline.main --script "$SCRIPT" --item "$i" --out "$dir" --history state/history.json || failed=1
            elif [ "$MODE" = "matchday" ]; then
              python -m pipeline.fixtures --out "$dir" --auto --emphasize "$UCL_EMPHASIZE" || failed=1
            elif [ "$MODE" = "ucl" ]; then
              extra=(); [ "$UCL_RESULTS" = "true" ] && extra+=(--results)
              python -m pipeline.fixtures --out "$dir" --emphasize "$UCL_EMPHASIZE" "${extra[@]}" || failed=1
            else
              python -m pipeline.main --mode "$MODE" --out "$dir" --history state/history.json || failed=1
            fi
          done
          exit $failed
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() }}
        with:
          path: state
          key: history-${{ github.run_id }}
      - name: YouTube'a yükle
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.upload) }}
        env:
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PUBLISH_AT: ${{ inputs.publish_at }}
        run: |
          failed=0
          for meta in out/metadata.json out/*/metadata.json; do
            [ -f "$meta" ] || continue
            python -m pipeline.upload "$(dirname "$meta")/short.mp4" "$meta" || failed=1
          done
          exit $failed
      # Instagram'ın yükleme sınırı YouTube'dan ayrı: YouTube sınıra takılsa da Reels paylaşılır.
      # IG_ACCESS_TOKEN secret'ı yoksa adım hiçbir şey yapmaz.
      - name: Instagram'a yükle
        # Zamanlanmış YouTube yayınında Instagram ayrıca yayın günü yüklenir (Instagram API zamanlamayı desteklemiyor)
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.upload) && !inputs.publish_at }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          failed=0
          for meta in out/metadata.json out/*/metadata.json; do
            [ -f "$meta" ] || continue
            python -m pipeline.instagram "$(dirname "$meta")/short.mp4" "$meta" || failed=1
          done
          exit $failed
      # Yüklemeden sonra saklanır: metadata.json'da YouTube bağlantısı da olur, yeniden yükleme bunu atlar
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: short
          retention-days: 14  # depolama kotası sınırlı; yeniden yükleme için iki hafta yeter
          path: |
            out/short.mp4
            out/metadata.json
            out/*/short.mp4
            out/*/metadata.json
      # Telegram mesajı ve yönetim panelinin okuduğu kayıt; başarısız çalışmalar da bildirilir
      - name: Sonucu bildir
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline.report out
