name: Short üret

on:
  # Saatler Türkiye saatiyle (UTC+3). GitHub zamanlamayı geciktirebildiği için 10 dakika erken başlar.
  schedule:
    # 07:15: sabah paketi, arka arkaya 3 video
    - cron: "5 4 * * *"
    # 10, 12, 17 ve 19: birer gündem haberi
    - cron: "50 6,8,13,15 * * *"
    # 15 ve 23: bilim ve teknolojiden merak uyandıran gelişmeler (trend)
    - cron: "50 11,19 * * *"
    # 16:00 ve 02:00: dünya gündeminden İngilizce birer haber (ABD'de sabah ve akşam)
    - cron: "50 12,22 * * *"
    # 13:30: spor gündemi özeti
    - cron: "20 10 * * *"
    # 20:30: günün öne çıkan haberleri özeti
    - cron: "20 17 * * *"
  workflow_dispatch:
    inputs:
      upload:
        description: "Üretilen videoyu kanala da yükle"
        type: boolean
        default: false
      count:
        description: "Kaç video üretilsin"
        type: number
        default: 1
      script:
        description: "Elle yazılmış metin dosyası (örnek: scripts/custom/2026-10-13.json); doluysa içindeki bütün videolar üretilir"
        type: string
        default: ""
      mode:
        description: "Video türü: story (gündem haberi), world (İngilizce dünya haberi), trend (bilim ve teknoloji özeti), digest (günün özeti), sports (spor gündemi), ucl (Şampiyonlar Ligi maç programı)"
        type: choice
        options: [story, world, trend, digest, sports, ucl]
        default: story

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write  # sonuç kaydı panel-data dalına yazılır
    env:
      COUNT: ${{ github.event.schedule == '5 4 * * *' && 3 || inputs.count || 1 }}
      MODE: ${{ inputs.script && 'custom' || github.event.schedule == '20 10 * * *' && 'sports' || github.event.schedule == '20 17 * * *' && 'digest' || github.event.schedule == '50 11,19 * * *' && 'trend' || github.event.schedule == '50 12,22 * * *' && 'world' || inputs.mode || 'story' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sistem paketleri
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Python paketleri
        run: pip install -r requirements.txt
      # Aynı haber ikinci kez videoya dönmesin diye işlenenler çalışmalar arasında taşınır
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: history-${{ github.run_id }}
          restore-keys: history-
      # İlk video out/, sonrakiler out/2, out/3... altına yazılır; işlenen haber kaydı sayesinde konular farklı olur
      - name: Videoları üret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCRIPT: ${{ inputs.script }}
        run: |
          failed=0
          if [ -n "$SCRIPT" ]; then
            COUNT=$(python -c "import json, sys; print(len(json.load(open(sys.argv[1], encoding='utf-8'))))" "$SCRIPT")
          fi
          for i in $(seq 1 "$COUNT"); do
            dir=out; [ "$i" -gt 1 ] && dir="out/$i"
            if [ -n "$SCRIPT" ]; then
              python -m pipeline.main --script "$SCRIPT" --item "$i" --out "$dir" --history state/history.json || failed=1
            elif [ "$MODE" = "ucl" ]; then
              python -m pipeline.fixtures --out "$dir" || failed=1
            else
              python -m pipeline.main --mode "$MODE" --out "$dir" --history state/history.json || failed=1
            fi
          done
          exit $failed
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() }}
        with:
          path: state
          key: history-${{ github.run_id }}
      - name: YouTube'a yükle
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.upload) }}
        env:
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          failed=0
          for meta in out/metadata.json out/*/metadata.json; do
            [ -f "$meta" ] || continue
            python -m pipeline.upload "$(dirname "$meta")/short.mp4" "$meta" || failed=1
          done
          exit $failed
      # Yüklemeden sonra saklanır: metadata.json'da YouTube bağlantısı da olur, yeniden yükleme bunu atlar
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: short
          path: |
            out/short.mp4
            out/metadata.json
            out/*/short.mp4
            out/*/metadata.json
      # Telegram mesajı ve yönetim panelinin okuduğu kayıt; başarısız çalışmalar da bildirilir
      - name: Sonucu bildir
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline.report out
