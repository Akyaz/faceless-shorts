name: TTS deneme (geçici)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Örnek üret
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p samples
          python3 - <<'PY'
          import base64, json, os, subprocess, urllib.request, urllib.error
          key = os.environ["KEY"]
          text = "Kerem, sence insanlar önce tapınak mı yaptı, yoksa önce köy mü kurdu? Stonehenge'den altı bin yıl daha eski bir yer var."
          for model in ["gemini-3.8-flash-tts", "gemini-3.8-flash-lite-tts", "gemini-3.1-flash-tts-preview", "gemini-2.5-flash-preview-tts"]:
              for voice in ["Kore", "Charon"]:
                  body = {"contents": [{"parts": [{"text": "Doğal, akıcı ve sakin bir belgesel anlatıcısı gibi Türkçe oku: " + text}]}],
                          "generationConfig": {"responseModalities": ["AUDIO"],
                                               "speechConfig": {"voiceConfig": {"prebuiltVoiceConfig": {"voiceName": voice}}}}}
                  req = urllib.request.Request(f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent",
                        data=json.dumps(body).encode(), headers={"x-goog-api-key": key, "Content-Type": "application/json"})
                  try:
                      out = json.load(urllib.request.urlopen(req, timeout=120))
                      pcm = base64.b64decode(out["candidates"][0]["content"]["parts"][0]["inlineData"]["data"])
                      name = f"samples/{model}-{voice}"
                      open(name + ".pcm", "wb").write(pcm)
                      subprocess.run(["ffmpeg", "-loglevel", "error", "-f", "s16le", "-ar", "24000", "-ac", "1", "-i", name + ".pcm", name + ".mp3"], check=True)
                      os.remove(name + ".pcm")
                      print(model, voice, "OK", round(len(pcm) / 48000, 1), "sn")
                  except urllib.error.HTTPError as e:
                      msg = e.read().decode()
                      print(model, voice, "HTTP", e.code, " ".join(l.strip() for l in msg.splitlines() if "limit" in l or "message" in l)[:500])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: samples
          path: samples
          retention-days: 2
