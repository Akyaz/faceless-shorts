name: Hazır videoyu yükle

# Daha önce üretilmiş bir "Short üret" çalışmasının videosunu kanala yükler
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Videoyu üreten çalışmanın numarası (Actions linkindeki sayı)"
        required: true
      privacy:
        description: "public, unlisted veya private"
        default: public

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: short
          path: out
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: YouTube'a yükle
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ inputs.privacy }}
        run: python -m pipeline.upload out/short.mp4 out/metadata.json
