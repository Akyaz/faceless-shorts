name: Hazır videoyu yükle

# Daha önce üretilmiş bir çalışmanın videolarını kanala yükler (örneğin günlük yükleme sınırına takılanları).
# Zaten yüklenmiş olanlar atlanır.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Videoları üreten çalışmanın numarası (Actions linkindeki sayı)"
        required: true
      privacy:
        description: "public, unlisted veya private"
        default: public

# Aynı çalışmanın videoları için iki yükleme aynı anda çalışmasın: ikincisi bekler ve kayıtta
# bağlantıyı görünce yüklemeyi atlar (panel ve elle tetikleme çakışınca video iki kez çıkmıştı)
concurrency:
  group: upload-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write  # sonuç kaydı panel-data dalına yazılır
    env:
      MODE: retry
      SOURCE_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: "{short,weekly,longform,longform-video}"  # tarih videosunun önizlemesi de yüklenebilir
          merge-multiple: true
          path: out
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: YouTube'a yükle
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ inputs.privacy }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          failed=0
          for meta in out/metadata.json out/*/metadata.json; do
            [ -f "$meta" ] || continue
            dir=$(dirname "$meta")
            video="$dir/short.mp4"; [ -f "$video" ] || video="$dir/video.mp4"
            python -m pipeline.upload "$video" "$meta" || failed=1
          done
          exit $failed
      - name: Sonucu bildir
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m pipeline.report out
